<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">

<title>Shape of my life</title>
<style>
:root{--bg:#0f1115;--card:#181b21;--card2:#232831;--line:#2a2f38;--text:#f1f3f6;--mute:#8e97a4;--acc:#ff7a3d;--acc2:#ffb08a;--accbg:#2b1b12;--ok:#3ecf8e;--okbg:#10261c;--warn:#ffc845;--bad:#ff5d5d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.full{padding-bottom:0}
body.full #app{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 24px}
button{font-family:inherit;cursor:pointer;transition:transform .08s,background .15s}
button:active{transform:scale(.96)}
h1{font-size:27px;margin:2px 0 0;letter-spacing:-.4px;line-height:1.15}
h2{font-size:23px;margin:2px 0 2px;letter-spacing:-.3px;line-height:1.2}
h3{font-size:16px;margin:0 0 8px}
p{margin:6px 0}
.mute{color:var(--mute)}.small{font-size:13px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--mute);font-weight:700}
.eyebrow.acc{color:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:4px 2px 6px}
.top .date{color:var(--mute);font-size:14px;font-weight:600;padding-bottom:5px}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;border:1px solid var(--line)}
.hero{background:radial-gradient(120% 90% at 100% 0%,#3a2114 0%,var(--card) 60%);border-color:#4a2c1d}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meta{display:flex;gap:14px;font-size:13px;color:var(--acc2);font-weight:600;margin:10px 0 2px}
.plist{list-style:none;margin:6px 0 0;padding:0;counter-reset:p}
.plist li{display:flex;gap:8px;padding:7px 0;border-top:1px solid #ffffff0f;font-size:14.5px;counter-increment:p}
.plist li::before{content:counter(p);width:18px;color:var(--mute);font-size:12px;font-weight:700;padding-top:2px;flex:none}
.plist li span:first-of-type{flex:1}
.plist li:first-child{border-top:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:14px 16px;font-weight:700;font-size:17px;background:var(--acc);color:#1b0f08;box-shadow:0 8px 22px -10px #ff7a3daa}
.btn.big{padding:17px;font-size:18.5px;margin-top:14px}
.btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.35;box-shadow:none}
.row{display:flex;gap:8px}.row>*{flex:1}
.row .btn{margin-top:8px;font-size:15px;padding:12px 8px}
.link{background:none;border:0;color:var(--mute);font-weight:600;font-size:15px;padding:14px;width:100%}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{background:var(--card2);border-radius:12px;padding:10px 12px;flex:1;min-width:90px}
.pill b{display:block;font-size:20px}.pill span{font-size:12px;color:var(--mute)}
.habit{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.habit:first-of-type{border-top:0}
.tick{width:30px;height:30px;border-radius:10px;border:2px solid #3a414d;display:grid;place-items:center;font-weight:800;color:#0d1a12;flex:none;transition:background .15s}
.habit.on .tick{background:var(--ok);border-color:var(--ok)}
.habit.on>div:last-child{color:var(--mute)}
.habit small{display:block;color:var(--mute);font-size:12px}
.bar{height:8px;background:var(--card2);border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:5px}
.goal{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:12px 0}
.goal .v{font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px}
.goal .bar{grid-column:1/3;margin-top:2px}
.banner{background:#2b2510;border:1px solid #5c4c14;color:#ffe08a;border-radius:16px;padding:12px 14px;margin:12px 0;font-size:15px}
.banner.blue{background:#13202b;border-color:#21435c;color:#a9d6ff}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.day{background:var(--card2);border-radius:12px;padding:7px 0 8px;text-align:center;font-size:10.5px;color:var(--mute);position:relative}
.day b{display:block;font-size:13px;color:var(--text);margin-bottom:2px}
.day.today{box-shadow:inset 0 0 0 2px var(--acc)}
.day.past{opacity:.45}
.day.tr{background:var(--accbg);color:var(--acc)}
.day.ha{background:var(--okbg);color:var(--ok)}
.day.u{background:#0f2630;color:#5ac8e8}
.banner.green{background:#10261c;border-color:#1f5a3d;color:#8ff0bf}
.x.hypo{background:#2e1414;border-color:#6a2323;color:#ffb0b0;font-size:12.5px;font-weight:800;width:auto;padding:0 10px}
.x.sm{width:30px;height:30px;font-size:13px;border-radius:9px}
.review .pill{min-width:0;padding:10px}
.ringw.hypo .val{stroke:var(--bad)}
.vac{background:radial-gradient(120% 90% at 100% 0%,#0f3340 0%,var(--card) 60%);border-color:#1d4a57}
.vac .stage{margin:6px 0 4px}.vac .stage svg.fig{height:170px}
input[type=date]{color-scheme:dark}
.day.u::after,.day.tr::after,.day.ha::after{content:'✓';position:absolute;top:3px;right:5px;font-size:10px;font-weight:800}
nav{position:fixed;left:0;right:0;bottom:0;background:#0d0f13ee;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:190px;background:none;border:0;color:var(--mute);font-weight:600;font-size:12px;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--acc)}
nav svg{width:24px;height:24px}
body.full nav{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 8px 10px;cursor:pointer}
.ex svg{width:100%;display:block;background:#14171d;border-radius:11px}
.ex b{display:block;font-size:14px;margin-top:6px}.ex span{font-size:12px;color:var(--mute)}
.sec-title{margin:22px 4px 2px}
svg.fig{width:100%;display:block}
.stage{position:relative;background:radial-gradient(90% 80% at 50% 40%,#1e232c,#14171d);border-radius:20px;margin:0 0 12px;border:1px solid var(--line);cursor:pointer}
.stage svg.fig{height:min(28vh,260px)}
.sheet .stage svg.fig{height:auto}
.gstage{position:relative;background:radial-gradient(90% 80% at 50% 40%,#1e232c,#14171d);border:1px solid var(--line);border-radius:16px;margin:0 0 10px}
.gstage svg{width:100%;display:block;max-height:250px}
.plist li{cursor:pointer}
.mmap{display:flex;gap:8px;background:radial-gradient(90% 80% at 50% 40%,#1e232c,#14171d);border:1px solid var(--line);border-radius:16px;padding:10px 8px 6px;margin:0 0 8px}
.mmap div{flex:1;text-align:center}.mmap svg{width:100%;max-height:330px;display:block}.mmap>div>span{font-size:12px;color:var(--mute);font-weight:600}
.mleg{font-size:13.5px;margin:4px 0;display:flex;gap:8px;align-items:baseline}.mleg i{width:11px;height:11px;border-radius:3px;flex:none;transform:translateY(1px)}
.stage-i{position:absolute;right:10px;top:10px;font-size:12px;color:var(--mute);background:#0f1115cc;border-radius:10px;padding:4px 9px;font-weight:600}
.wk-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.wk-mid{flex:1;min-width:0}
.wk-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute);font-weight:600;margin-top:7px;font-variant-numeric:tabular-nums}
.x{background:var(--card2);border:1px solid var(--line);color:var(--text);width:42px;height:42px;border-radius:13px;font-size:17px;flex:none}
.prog{height:6px;background:var(--card2);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .3s}
.ex-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.dots{display:flex;gap:5px;flex:none;padding-bottom:3px}
.dot{min-width:30px;height:30px;padding:0 6px;border-radius:10px;background:var(--card2);color:var(--mute);display:grid;place-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.dot.d{background:var(--okbg);color:var(--ok)}
.dot.c{background:var(--accbg);color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.cues-d{margin:10px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.cues-d summary{padding:11px 0;font-weight:600;font-size:14.5px;color:#d7dce3;list-style:none;display:flex;justify-content:space-between;cursor:pointer}
.cues-d summary::-webkit-details-marker{display:none}
.cues-d summary::after{content:'+';color:var(--mute);font-size:18px;line-height:1}
.cues-d[open] summary::after{content:'−'}
.cues{margin:0 0 12px;padding-left:20px;color:#d7dce3;font-size:15px}.cues li{margin:5px 0}
.sheet .cues{margin:8px 0}
.target{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin:10px 0 4px}
.target span{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.target b{font-size:17px;font-variant-numeric:tabular-nums}
.target.center{grid-template-columns:1fr;text-align:center;padding:18px}.target.center b{font-size:30px}
.hint{color:var(--acc2);font-size:14px;margin:6px 2px 2px}
.steps{display:flex;gap:10px;margin-top:12px}
.stepper{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;text-align:center}
.stepper .ctl{display:flex;align-items:center;justify-content:space-between}
.stepper button{width:50px;height:50px;border-radius:14px;border:0;background:var(--card2);color:var(--text);font-size:26px;font-weight:600}
.stepper output{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.stepper label{font-size:11px;color:var(--mute);display:block;text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-bottom:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:20px;padding:7px 12px;font-weight:600;font-size:13px}
.chip.on{border-color:var(--acc);color:var(--acc);background:var(--accbg)}
.ringrow{display:flex;align-items:center;justify-content:center;gap:12px}
.rb{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--text);font-weight:700;font-size:15px;flex:none}
.ringw{position:relative;width:min(56vw,224px);aspect-ratio:1;margin:8px auto}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ringw .trk{fill:none;stroke:var(--card2);stroke-width:9}
.ringw .val{fill:none;stroke:var(--acc);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .2s linear,stroke .3s}
.ringw.ok .val{stroke:var(--ok)}.ringw.lead .val{stroke:var(--warn)}.ringw.rest .val{stroke:#5aa9ff}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringc b{font-size:clamp(44px,14vw,58px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1}
.ringc span{font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-top:7px}
.ringw.ok .ringc span{color:var(--ok)}.ringw.lead .ringc b{color:var(--warn)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:22px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(#0f111500,var(--bg) 38%);z-index:6}
.dock .in{max-width:528px;margin:0 auto;display:flex;gap:10px}
.dock .btn{margin:0;flex:1}.dock .btn.sec{flex:0 0 36%}
.overlay{position:fixed;inset:0;background:#0b0d10;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom));text-align:center}
.overlay .ringw{width:min(62vw,250px)}
.overlay .row{width:100%;max-width:440px;margin-top:10px}
.next{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 14px 8px 8px;text-align:left;width:100%;max-width:440px;margin-top:14px}
.next svg.mini{width:92px;flex:none;background:#14171d;border-radius:12px}
.next b{display:block;font-size:17px;margin:2px 0}
.done-hero{text-align:center;padding:30px 0 4px}.done-hero .em{font-size:54px;line-height:1}
.up{color:var(--ok);font-weight:700;font-size:12.5px;white-space:nowrap}
input.num:focus,.field input:focus{outline:none;border-color:var(--acc)}
input.num::placeholder{color:#4a515c;font-weight:700}
input.num{width:100%;font-weight:800;font-size:40px;font-family:inherit;text-align:center;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:16px;padding:12px}
.verdict{border-radius:14px;padding:12px 14px;margin:12px 0;font-size:15px;min-height:48px}
.verdict.ok{background:#11291e;color:#8ff0bf;border:1px solid #1f5a3d}
.verdict.warn{background:#2b2510;color:#ffe08a;border:1px solid #5c4c14}
.verdict.bad{background:#2e1414;color:#ffb0b0;border:1px solid #6a2323}
.chk{display:flex;gap:10px;align-items:center;margin:12px 2px;font-size:15px}
.chk input{width:22px;height:22px;accent-color:var(--acc)}
.sheet-bg{position:fixed;inset:0;background:#000a;z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s ease-out}
.sheet::before{content:'';display:block;width:40px;height:4px;border-radius:2px;background:#3a414d;margin:0 auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.5}}@keyframes fade{from{opacity:0}}
.field{margin:10px 0}.field label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.field input{width:100%;font-weight:600;font-size:20px;font-family:inherit;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px}
.list{margin:0;padding:0;list-style:none}.list li{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-top:1px solid var(--line);font-size:14px}
.list li:first-child{border-top:0}
.list li.cur{color:var(--acc);font-weight:700}
.list li.click{cursor:pointer}
.spark{width:100%;height:60px;display:block;margin-top:6px}
.dbg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.dbg div{background:#171b21;border-radius:8px;font-size:10px;padding:2px}
</style>
</head>

<div id="app"></div>
<nav id="nav">
  <button data-r="heute" onclick="go('heute')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Heute</button>
  <button data-r="uebungen" onclick="go('uebungen')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Übungen</button>
  <button data-r="fortschritt" onclick="go('fortschritt')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19l5-6 4 3 7-9"/><path d="M15 7h5v5"/></svg>Fortschritt</button>
</nav>
<div id="sheet"></div>
<script>
'use strict';
/* =========================================================
   Figuren-Engine (Seitenansicht, schaut nach rechts)
   Winkel: 0 = nach unten, 90 = nach vorn (rechts), 180 = nach oben, -90 = nach hinten
   ========================================================= */
const L={T:50,N:6,R:10,UA:28,FA:26,TH:40,SH:40,F:11};
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const add=(p,a,l)=>[p[0]+Math.sin(rad(a))*l,p[1]+Math.cos(rad(a))*l];
const ang=(p,q)=>deg(Math.atan2(q[0]-p[0],q[1]-p[1]));
function ik(root,tgt,a,b,bend){
  let d=Math.hypot(tgt[0]-root[0],tgt[1]-root[1]);
  d=Math.min(Math.max(d,Math.abs(a-b)+0.01),a+b-0.01);
  const base=ang(root,tgt);
  const al=deg(Math.acos((a*a+d*d-b*b)/(2*a*d)));
  const a1=base+bend*al, j=add(root,a1,a), end=add(root,base,d);
  return [a1,ang(j,end)];
}
function solve(p){
  const J={}, t=p.t;
  J.hip=p.hip; J.t=t; J.c=p.c||0;
  J.S=add(J.hip,t,L.T);
  J.ha=t+(p.hd||0);
  J.H=add(J.S,J.ha,L.N+L.R);
  const arm=sfx=>{const g=k=>p[k+sfx];let ua,fa;
    if(g('h'))[ua,fa]=ik(J.S,g('h'),L.UA,L.FA,g('hb')??-1);
    else if(g('uaR')!=null){ua=t+g('uaR');fa=t+g('faR')}
    else{ua=g('ua')??0;fa=g('fa')??0}
    const E=add(J.S,ua,L.UA);return [E,add(E,fa,L.FA)]};
  const leg=sfx=>{const g=k=>p[k+sfx];let th,sh;
    if(g('f'))[th,sh]=ik(J.hip,g('f'),L.TH,L.SH,g('fb')??1);
    else{th=g('th')??0;sh=g('sh')??0}
    const K=add(J.hip,th,L.TH),A=add(K,sh,L.SH);return [K,A,add(A,g('ft')??(sh+90),L.F)]};
  const a2=['h2','ua2','uaR2'].some(k=>p[k]!=null)?'2':'';
  const l2=['f2','th2'].some(k=>p[k]!=null)?'2':'';
  [J.E,J.W]=arm('');[J.E2,J.W2]=arm(a2);
  [J.K,J.A,J.Toe]=leg('');[J.K2,J.A2,J.Toe2]=leg(l2);
  return J;
}
function lerpPose(a,b,u){const o={};for(const k of new Set([...Object.keys(a),...Object.keys(b)])){const x=a[k],y=b[k];
  if(typeof x==='number'&&typeof y==='number')o[k]=x+(y-x)*u;
  else if(Array.isArray(x)&&Array.isArray(y))o[k]=[x[0]+(y[0]-x[0])*u,x[1]+(y[1]-x[1])*u];
  else o[k]=u<.5?(x??y):(y??x);}return o}
const ease=u=>.5-.5*Math.cos(Math.PI*u);
function prep(frames){let prev={hd:0,c:0};return frames.map(f=>{const p=Object.assign({},prev,f.p);prev=p;return Object.assign({},f,{p})})}
function poseAt(fr,ms){let tot=0;for(const f of fr)tot+=(f.h||0)+(f.d||0);let t=ms%tot;
  for(let i=0;i<fr.length;i++){const f=fr[i];if(t<(f.h||0))return f.p;t-=(f.h||0);
    if(t<f.d)return lerpPose(f.p,fr[(i+1)%fr.length].p,ease(t/f.d));t-=f.d}return fr[0].p}

const COL={body:'#e7e2da',body2:'#8f98a4',acc:'#ff7a3d',acc2:'#b4532a',shorts:'#3a4762',shorts2:'#2a3348',hair:'#3a2c26',eye:'#1b1e24'};
const P=n=>n.toFixed(1);
const ln=(a,b,w,c)=>`<line x1="${P(a[0])}" y1="${P(a[1])}" x2="${P(b[0])}" y2="${P(b[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const dot=(a,r,c)=>`<circle cx="${P(a[0])}" cy="${P(a[1])}" r="${r}" fill="${c}"/>`;
function colr(ex,seg,side){const f=ex.focus||[];const on=f.includes(seg)||f.includes(seg+side);
  return side==='2'?(on?COL.acc2:COL.body2):(on?COL.acc:COL.body)}
function figSVG(ex,p){
  if(ex.view==='front')return frontSVG(ex,p);
  const J=solve(p),sh=ex.shift||[0,0];
  const gl=(ex.focus||[]).includes('glute');
  let s=`<g transform="translate(${sh[0]},${sh[1]})">`+props(ex,J,'back');
  // hinteres Bein + Arm
  s+=ln(J.hip,J.K2,13,colr(ex,'th','2'))+ln(J.K2,J.A2,10,colr(ex,'sh','2'))+ln(J.A2,J.Toe2,6,colr(ex,'sh','2'));
  s+=ln(J.hip,add(J.hip,ang(J.hip,J.K2),17),14,gl?COL.acc2:COL.shorts2);
  s+=ln(J.S,J.E2,9,colr(ex,'ua','2'))+ln(J.E2,J.W2,8,colr(ex,'fa','2'))+dot(J.W2,4.5,colr(ex,'fa','2'));
  // Rumpf
  const mid=[(J.hip[0]+J.S[0])/2,(J.hip[1]+J.S[1])/2],ctl=add(mid,J.t+90,J.c*2);
  const tc=colr(ex,'torso','1');
  s+=`<path d="M${P(J.hip[0])} ${P(J.hip[1])} Q${P(ctl[0])} ${P(ctl[1])} ${P(J.S[0])} ${P(J.S[1])}" stroke="${tc}" stroke-width="18" stroke-linecap="round" fill="none"/>`;
  s+=dot(J.hip,9.5,gl?COL.acc:COL.shorts);
  // vorderes Bein
  s+=ln(J.hip,J.K,13,colr(ex,'th','1'))+ln(J.K,J.A,10,colr(ex,'sh','1'))+ln(J.A,J.Toe,6,colr(ex,'sh','1'));
  s+=ln(J.hip,add(J.hip,ang(J.hip,J.K),17),14,gl?COL.acc:COL.shorts);
  // Kopf
  s+=ln(J.S,add(J.S,J.ha,L.N+3),8,COL.body);
  s+=dot(add(J.H,J.ha+90,2.2),10,COL.hair)+dot(add(J.H,J.ha-90,0.6),9.2,COL.body);
  s+=dot(add(add(J.H,J.ha-90,5),J.ha,2.2),1.6,COL.eye);
  // vorderer Arm
  s+=ln(J.S,J.E,9,colr(ex,'ua','1'))+ln(J.E,J.W,8,colr(ex,'fa','1'))+dot(J.W,4.5,colr(ex,'fa','1'));
  return s+props(ex,J,'front')+'</g>';
}
function frontSVG(ex,p){
  let s=`<rect x="66" y="4" width="108" height="197" rx="6" fill="#222832"/><line x1="0" y1="201" x2="240" y2="201" stroke="#3a4250" stroke-width="2"/>`;
  const c1=colr(ex,'ua','1'),c2=colr(ex,'fa','1');
  s+=ln([112,120],[109,194],13,COL.body)+ln([128,120],[131,194],13,COL.body);
  s+=ln([109,195],[100,197],6,COL.body)+ln([131,195],[140,197],6,COL.body);
  s+=`<path d="M101 66 L139 66 L133 120 L107 120 Z" fill="${colr(ex,'torso','1')}" stroke="${colr(ex,'torso','1')}" stroke-width="10" stroke-linejoin="round"/>`;
  s+=`<rect x="104" y="112" width="32" height="20" rx="7" fill="${COL.shorts}"/>`;
  for(const sx of [1,-1]){const S=[120+sx*21,68];
    const E=[S[0]+sx*Math.sin(rad(p.ua))*28,S[1]+Math.cos(rad(p.ua))*28];
    const W=[E[0]+sx*Math.sin(rad(p.fa))*26,E[1]+Math.cos(rad(p.fa))*26];
    s+=ln(S,E,9,c1)+ln(E,W,8,c2)+dot(W,4.5,c2);}
  s+=ln([120,62],[120,52],8,COL.body)+dot([120,42],11,COL.hair)+dot([120,45],10,COL.body)+dot([116,44],1.5,COL.eye)+dot([124,44],1.5,COL.eye);
  return s;
}
function props(ex,J,layer){let s='';
  for(const pr of ex.props||[]){const [k,...a]=pr;
    if(layer==='back'){
      if(k==='floor')s+=`<line x1="0" y1="201" x2="240" y2="201" stroke="#3a4250" stroke-width="2"/>`;

      if(k==='hyper')s+=`<line x1="0" y1="201" x2="240" y2="201" stroke="#3a4250" stroke-width="2"/><line x1="118" y1="131" x2="122" y2="201" stroke="#4d5563" stroke-width="5"/><line x1="57" y1="161" x2="76" y2="201" stroke="#4d5563" stroke-width="5"/><line x1="58" y1="200" x2="140" y2="200" stroke="#4d5563" stroke-width="5"/><line x1="129" y1="121.7" x2="107.8" y2="139.9" stroke="#6b5a4a" stroke-width="10" stroke-linecap="round"/><circle cx="57.4" cy="160.7" r="5.5" fill="#6b5a4a"/>`;
      if(k==='handles')for(const x of [a[0]])s+=`<rect x="${x-10}" y="${a[1]+1}" width="20" height="8" rx="3" fill="#4d5563"/><line x1="${x-6}" y1="${a[1]}" x2="${x+6}" y2="${a[1]}" stroke="#a3adbb" stroke-width="4" stroke-linecap="round"/>`;
    }else{
      if(k==='barbell')s+=`<circle cx="${P(J.W[0])}" cy="${P(J.W[1])}" r="13" fill="#2a2f38" fill-opacity=".9" stroke="#6b7484" stroke-width="3"/><circle cx="${P(J.W[0])}" cy="${P(J.W[1])}" r="3" fill="#a3adbb"/>`;
    }}
  return s;
}

/* ---------- Heute ---------- */
function suggest(){
  const t=today(),ds=done(),dow=(parse(t).getDay()+6)%7,w=weekInfo();
  const lastTr=[...ds].reverse().find(isAB),ab=nextAB();
  if(ds.some(s=>s.date===t&&isAB(s)))return {title:'Training erledigt 💪',sub:'Heute nur noch Schritte, Eiweiß, Schlaf. Muskeln wachsen in der Pause.',type:null};
  if(lastTr&&days(lastTr.date,t)<=1)return {title:'Haltung + Spaziergang',sub:'Gestern war Kraft – heute Haltungsroutine und 30 min gehen.',type:'H',cta:'Haltungsroutine starten'};
  if(w.tr>=3)return {title:'Wochenziel erreicht ✅',sub:'3 Krafttrainings geschafft. Heute aktiv erholen.',type:'H',cta:'Haltungsroutine starten'};
  if(dow===6)return {title:'Ruhetag',sub:'Sonntag = Erholung. Spaziergang ist gut, Training nicht nötig.',type:'H',cta:'Optional: Haltungsroutine'};
  return {title:PLAN[ab].name,sub:ab==='A'?'Ganzkörper · Schwerpunkt Rücken, Brust, Beine.':'Ganzkörper · Schwerpunkt Schultern, Beinrückseite, Arme.',type:ab,cta:'Training starten'};
}
function estMin(t){if(t==='H')return 10;return 10+Math.round(PLAN[t].items.reduce((m,i)=>m+i.sets*((i.side?70:40)+(i.rest||90)),0)/60)}
function planList(t){return `<ol class="plist">${PLAN[t].items.map(i=>`<li onclick="sheetEx('${i.ex}')"><span>${EX[i.ex].name} <span class="mute small">ⓘ</span></span><span class="mute">${i.sets}× ${tgtTxt(i)}${i.side?' /Seite':''}</span></li>`).join('')}</ol>`}
const WPLAN=['Kraft','Haltung','Kraft','Haltung','Kraft','Aktiv','Frei'];
function weekStrip(){const t=today(),m=parse(monday(t));let h='<div class="week">';
  for(let k=0;k<7;k++){const d=new Date(m);d.setDate(m.getDate()+k);const ds=iso(d),ss=done().filter(s=>s.date===ds);
    const tr=ss.some(isAB),ha=ss.some(s=>s.type==='H'||s.warm),u=ss.some(s=>s.type==='U'||s.type==='Z');
    const vd=S.vac&&ds>=S.vac.from&&ds<=S.vac.until;
    h+=`<div class="day ${ds===t?'today':''} ${tr?'tr':ha?'ha':u?'u':''} ${ds<t&&!ss.length?'past':''}"><b>${'Mo Di Mi Do Fr Sa So'.split(' ')[k]}</b>${tr?'Kraft':ha?'Haltung':u?'Urlaub':vd?'🌴':WPLAN[k]}</div>`}
  return h+'</div>'}
function vHeute(){

function setUPick(k){S.uPick={date:today(),k};save();render()}
function streak(){const set=new Set(done().map(s=>s.date));const d=parse(today());if(!set.has(today()))d.setDate(d.getDate()-1);let n=0;while(set.has(iso(d))){n++;d.setDate(d.getDate()-1)}return n}

   <div class="meta"><span>${it.sets}× ${tgtTxt(it)}${it.side?' /Seite':''}</span><span>⏱ ca. 5 min</span></div>

function endVac(){S.vac=Object.assign({},S.vac,{until:iso(new Date(Date.now()-864e5))});if(S.vac.until<S.vac.from)S.vac=null;save();render()}

  if(backupDue())h+=`<div class="banner blue" onclick="exportData()"><b>💾 Backup fällig</b><br>${S.lastBackup?'Letztes am '+fmtD(S.lastBackup):'Noch keins gemacht'} – tippen → OneDrive → Ordner <i>daten/handy-backups</i>.</div>`;

function goalProg(g){const s=series(g.src,g.k);if(!s.length)return null;const f=s[0].v,c=s[s.length-1].v;

function setVar(ex,v){S.variants[ex]=v;save();initCur();render()}
function progHint(st,last){if(!last)return st.secs?'Erstes Mal: sauber halten – Stopp, sobald die Hüfte absinkt.':'Erstes Mal: Technik vor Gewicht – 1–3 Wdh. „im Tank“ lassen.';
  const top=st.secs?(Array.isArray(st.secs)?st.secs[1]:st.secs):(Array.isArray(repsOf(st))?repsOf(st)[1]:repsOf(st));
  const full=last.length>=st.sets&&last.every(x=>(st.secs?x.s:x.r)>=top);
  if(full)return st.kg?'↑ Letztes Mal alles geschafft – heute <b>mehr Gewicht</b> (+1,25–2,5 kg). Keine Scheiben mehr? Dann <b>3 s runter + 1 s Pause unten</b>.':st.secs?'↑ Alles geschafft – heute <b>länger halten</b> oder schwerere Variante.':'↑ Alles geschafft – heute <b>schwerere Variante</b> oder langsamer runter.';
  return st.secs?'↑ Ziel heute: <b>5 Sekunden länger</b> als letztes Mal.':'↑ Ziel heute: <b>1 Wiederholung mehr</b> als letztes Mal (in mind. einem Satz).'}
function nextSet(){const a=S.active,st=step();
  a.undo={i:a.i,si:a.si,cur:Object.assign({},a.cur),ex:st.blk!=='H'?st.ex:null};
  if(st.blk!=='H')(a.log[st.ex]=a.log[st.ex]||[]).push(st.secs?{s:a.cur.s}:{r:a.cur.r,kg:a.cur.kg});
  a.tm=null;a.si++;const moved=a.si>=setsOf(st);if(moved){a.i++;a.si=0}
  if(a.i>=a.steps.length){save();go('fertig');return}
  const nx=step(),R_=(s,label,auto)=>{a.rest={end:Date.now()+s*1000,total:s*1000,label,auto:!!auto}};
  if(st.blk!=='H')R_(st.rest||90,moved?'Pause · gleich nächste Übung':'Pause');
  else if(nx.blk!=='H')R_(60,'Aufwärmen geschafft 🔥');
  else if(!moved&&st.secs)st.side?R_(5,'Seite wechseln',true):R_(15,'Kurz lockern',true);
  initCur();save();render()}
function undoSet(){const a=S.active,u=a&&a.undo;if(!u)return;
  if(u.ex&&a.log[u.ex]){a.log[u.ex].pop();if(!a.log[u.ex].length)delete a.log[u.ex]}
  a.i=u.i;a.si=u.si;a.cur=u.cur;a.rest=null;a.tm=null;a.undo=null;save();render()}
function jumpTo(k){const a=S.active;closeSheet();if(k>=a.steps.length){go('fertig');return}
  a.i=k;a.si=0;a.rest=null;a.undo=null;initCur();save();render()}
function sheetList(){const a=S.active;
  openSheet(`<h2>${a.type==='H'?'Haltungsroutine':PLAN[a.type].name}</h2><p class="mute small">Tippen, um zu einer Übung zu springen.</p>
   <ul class="list">${a.steps.map((s,k)=>`<li class="click ${k===a.i?'cur':''}" onclick="jumpTo(${k})"><span>${k<a.i?'✓ ':k===a.i?'▶ ':''}${EX[s.ex].name}</span><span class="mute">${s.blk==='H'?'Aufwärmen':s.sets+'× '+tgtTxt(s)}</span></li>`).join('')}</ul>
   <div class="row"><button class="btn sec" onclick="toggleSound()">${S.sound===false?'🔕 Ton aus':'🔔 Ton an'}</button><button class="btn sec" onclick="jumpTo(S.active.i+1)">Übung überspringen</button></div>
   ${step().blk==='H'&&a.type!=='H'?`<button class="btn sec" style="margin-top:8px" onclick="jumpTo(S.active.steps.findIndex(s=>s.blk!=='H'))">Aufwärmen überspringen</button>`:''}
   <button class="link" onclick="closeSheet()">Schließen</button>`)}
function toggleSound(){S.sound=S.sound===false;save();if(S.sound)beep('tick');sheetList()}
function askAbort(){const a=S.active,has=Object.keys(a.log).length>0||(a.type==='H'&&a.i>0);
  openSheet(`<h2>Training beenden?</h2><p class="mute">${has?'Erledigte Sätze werden gespeichert.':'Noch kein Satz gespeichert.'}</p>
   ${has?`<button class="btn big" onclick="closeSheet();go('fertig')">Beenden & speichern</button>`:''}
   <button class="btn sec" style="margin-top:10px" onclick="discardWk()">Verwerfen</button>
   <button class="link" onclick="closeSheet()">Weitermachen</button>`)}
function discardWk(){S.active=null;save();closeSheet();unlockScreen();go('heute')}

/* ---------- Timer (Halten / Stoppuhr) ---------- */
const LEAD=3000,RC=2*Math.PI*52;
const fmtS=s=>Math.floor(s/60)+':'+z(s%60);
const tmEl=tm=>tm.paused!=null?tm.paused:Date.now()-tm.t0;
function tmStart(lead){const a=S.active,st=step();
  a.tm={mode:st.blk==='H'?'down':'up',ms:(a.cur.s||30)*1000,t0:Date.now()+(lead===false?0:LEAD),paused:null,id:Date.now()};save();render()}
function tmPause(){const a=S.active,tm=a.tm;if(!tm)return;tm.paused=tmEl(tm);if(tm.paused<0)a.tm=null;save();render()}
function tmResume(){const tm=S.active.tm;tm.t0=Date.now()-tm.paused;tm.paused=null;save();render()}
function tmReset(){S.active.tm=null;save();render()}
function tmStop(){const a=S.active,tm=a.tm;if(!tm)return;const el=tmEl(tm);
  if(el<1000){a.tm=null;save();render();return}
  if(tm.mode==='up')a.cur.s=Math.floor(el/1000);nextSet()}
function timerVals(){const a=S.active,tm=a.tm,st=step();
  if(!tm)return [0,fmtS(a.cur.s),st.blk==='H'?'halten':'Ziel',''];
  const el=tmEl(tm);
  if(el<0)return [(LEAD+el)/LEAD,String(Math.ceil(-el/1000)),'Bereit machen','lead'];
  const p=tm.paused!=null;
  if(tm.mode==='down'){const left=Math.max(0,tm.ms-el);return [el/tm.ms,fmtS(Math.ceil(left/1000)),p?'Pausiert':'halten','']}
  const hit=el>=tm.ms;return [Math.min(1,el/tm.ms),fmtS(Math.floor(el/1000)),p?'Pausiert':hit?'Ziel erreicht ✓':'Ziel '+fmtS(tm.ms/1000),hit?'ok':'']}
function ring(id,frac,big,small,cls){frac=Math.max(0,Math.min(1,frac));
  return `<div class="ringw ${cls||''}" id="${id}"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="trk"/><circle cx="60" cy="60" r="52" class="val" stroke-dasharray="${RC.toFixed(1)}" stroke-dashoffset="${(RC*(1-frac)).toFixed(1)}"/></svg><div class="ringc"><b>${big}</b><span>${small||''}</span></div></div>`}
function setRing(id,frac,big,small,cls){const w=document.getElementById(id);if(!w)return;
  w.querySelector('.val').setAttribute('stroke-dashoffset',(RC*(1-Math.max(0,Math.min(1,frac)))).toFixed(1));
  w.querySelector('b').textContent=big;if(small!=null)w.querySelector('span').textContent=small;if(cls!=null)w.className='ringw '+cls}

/* ---------- Pause ---------- */
function hypoStart(){const a=S.active;a.tm=null;(a.hypos=a.hypos||[]).push(new Date().toTimeString().slice(0,5));
  a.rest={end:Date.now()+15*60000,total:15*60000,label:'Hypo-Pause',kind:'hypo'};save();render()}
function hypoOverlay(){const a=S.active,r=a.rest,left=Math.max(0,r.end-Date.now()),over=left<=0;
  return `<div class="overlay"><div class="eyebrow" style="color:var(--bad)">🍬 Hypo-Pause · Training pausiert</div>${ring('rring',left/r.total,fmtS(Math.ceil(left/1000)),over?'Zeit um':'warten','hypo')}
   <div class="verdict ${over?'warn':'bad'}" style="max-width:440px;text-align:left;margin:6px 0">${over?'<b>15 min um.</b> In CamAPS schauen: <b>über 100 und nicht fallend</b> → locker weiter. Sonst nochmal 15 g KH oder Training beenden.':'<b>Jetzt 15 g schnelle KH</b> (z. B. 4 Traubenzucker oder 150 ml Saft). Hinsetzen, nicht trainieren. Nach 15 min neu schauen.'}</div>
   <div class="row"><button class="btn sec" onclick="hypoMore()">Nochmal 15 g + 15 min</button></div>
   <div class="row"><button class="btn sec" onclick="hypoQuit()">Training beenden</button><button class="btn" onclick="hypoEnd()">Weiter ▶</button></div></div>`}
function hypoMore(){const a=S.active;a.hypos.push(new Date().toTimeString().slice(0,5)+' +15g');a.rest={end:Date.now()+15*60000,total:15*60000,label:'Hypo-Pause',kind:'hypo'};save();render()}
function hypoEnd(){S.active.rest=null;save();render()}
function hypoQuit(){S.active.rest=null;save();go('fertig')}
function restOverlay(){if(S.active.rest.kind==='hypo')return hypoOverlay();const a=S.active,r=a.rest,st=step(),e=EX[st.ex],left=Math.max(0,r.end-Date.now()),{setNo,side}=sideInfo(st,a.si);
  return `<div class="overlay"><div class="eyebrow">${r.label}</div>${ring('rring',left/r.total,fmtS(Math.ceil(left/1000)),r.auto?'startet automatisch':'durchatmen','rest')}
   <div class="next">${figTag(st.ex,S.variants[st.ex],'mini')}<div><div class="eyebrow">Als Nächstes</div><b>${e.name}</b><div class="mute small">Satz ${setNo} von ${st.sets}${side?' · '+side:''} · ${st.blk==='H'&&!st.secs?st.reps+' Wdh.':st.blk==='H'?fmtS(st.secs):tgtTxt(st)}</div></div></div>
   <div class="row"><button class="btn sec" onclick="restAdj(-15)">−15 s</button><button class="btn sec" onclick="restAdj(15)">+15 s</button><button class="btn" onclick="restEnd()">Weiter ▶</button></div>
   <div class="row" style="width:100%;max-width:440px">${a.undo&&a.undo.ex?`<button class="link" onclick="undoSet()">↶ Korrigieren</button>`:''}<button class="link" style="color:#ffb0b0" onclick="hypoStart()">🍬 Hypo</button></div></div>`}
function restAdj(d){const r=S.active.rest;if(!r)return;r.end=Math.max(Date.now()+1000,r.end+d*1000);r.total=Math.max(r.total,r.end-Date.now());save();tick()}
function restEnd(){const a=S.active,r=a.rest;a.rest=null;if(r&&r.auto){tmStart(false);return}save();render()}

/* ---------- Fertig ---------- */
function vFertig(){const a=S.active;if(!a)return vHeute();
  const min=Math.max(1,Math.round((Date.now()-a.started)/60000)),sets=Object.values(a.log).reduce((n,x)=>n+x.length,0);
  const sc=x=>x.reduce((n,y)=>n+(y.s!=null?y.s:y.r*(1+(y.kg||0)/20)),0);let ups=0;
  const rows=Object.entries(a.log).map(([ex,l])=>{const p=lastLog(ex),up=p&&sc(l)>sc(p);if(up)ups++;
    return `<li><span>${EX[ex].name}${up?' <span class="up">↑ besser</span>':''}</span><span class="mute">${l.map(fmtSet).join(' · ')}</span></li>`}).join('');
  return `<div class="done-hero"><div class="em">💪</div><h1>Stark.</h1><p class="mute">${a.type==='H'?'Haltungsroutine':PLAN[a.type].name} · ${min} min${sets?' · '+sets+' Sätze':''}${ups?' · '+ups+'× besser als letztes Mal':''}${a.hypos&&a.hypos.length?' · 🍬 '+a.hypos.length+'× Hypo-Pause':''}</p></div>
   ${rows?`<section class="card"><h3>Heute geschafft</h3><ul class="list">${rows}</ul></section>`:''}
   ${a.type==='A'||a.type==='B'?`<section class="card"><p class="small" style="margin:0">🌙 <b>Heute Nacht:</b> Low-Alarm am Dexcom an. Verzögerte Hypos sind nach Krafttraining bis zu 24 h möglich – Abend-Strategie wie mit deinem Diabetes-Team besprochen.</p></section>`:''}
   <section class="card"><p style="margin:0">Jetzt: Eiweiß essen 🍳, viel trinken, heute noch Schritte sammeln.</p></section>
   <button class="btn big" onclick="finishWk()">Speichern ✓</button>
   ${a.i<a.steps.length?`<button class="link" onclick="go('training')">↶ Zurück zum Training</button>`:a.undo?`<button class="link" onclick="undoSet();go('training')">↶ Letzten Satz korrigieren</button>`:''}`}
function finishWk(){const a=S.active,el=document.getElementById('bga');
  S.sessions.push({date:today(),start:new Date(a.started).toTimeString().slice(0,5),end:new Date().toTimeString().slice(0,5),type:a.type,warm:a.warm,bgBefore:a.bgBefore,bgTrend:a.bgTrend,bgAfter:el?pnum('bga'):null,hypos:a.hypos||[],log:a.log,min:Math.max(1,Math.round((Date.now()-a.started)/60000)),done:true});
  levelUp(a);S.active=null;save();unlockScreen();go('heute')}
const VORDER={klimmzug:['neg','voll'],chinup:['neg','voll'],liegestuetze:['erhoeht','boden']};
function levelUp(a){for(const [ex,ord] of Object.entries(VORDER)){const l=a.log[ex],st=a.steps.find(s=>s.ex===ex&&s.blk!=='H');if(!l||!st)continue;
  const k=ord.indexOf(S.variants[ex]);if(k<0||k>=ord.length-1)continue;
  const rp=repsOf(st),top=Array.isArray(rp)?rp[1]:rp;
  if(l.length>=st.sets&&l.every(x=>x.r>=top)){S.variants[ex]=ord[k+1];(S.lvl=S.lvl||[]).push({date:today(),ex,to:ord[k+1]})}}}
function seenLvl(){(S.lvl||[]).forEach(x=>x.seen=true);save();render()}

/* ---------- Takt, Ton, Vibration, Wake-Lock ---------- */
let actx=null;
function audioUnlock(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
document.addEventListener('pointerdown',audioUnlock,{passive:true});
function tone(f,d,t0=0,v=.32){const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+t0;o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.03)}
function beep(k){
  if(S.sound!==false&&actx){try{if(actx.state==='suspended')actx.resume();
    if(k==='tick')tone(660,.13);else if(k==='go')tone(990,.45);else{tone(880,.16);tone(880,.16,.22);tone(1320,.5,.44)}}catch(e){}}
  if(navigator.vibrate)navigator.vibrate(k==='tick'?40:k==='go'?180:[220,90,220,90,380])}
const fired=new Set();function fire(k,f){if(!fired.has(k)){fired.add(k);f()}}
function tick(){const a=S.active;if(!a||R!=='training')return;
  const ck=document.getElementById('clock');if(ck)ck.textContent='⏱ '+fmtS(Math.floor((Date.now()-a.started)/1000));
  if(a.rest){const r=a.rest,left=r.end-Date.now(),s=Math.ceil(left/1000);
    if(left<=0){fire('re'+r.end,()=>beep('end'));if(r.kind==='hypo'){if(!r.over){r.over=true;save();render()}return}restEnd();return}
    if(s<=3)fire('r'+s+'_'+r.end,()=>beep('tick'));
    setRing('rring',left/r.total,fmtS(s));return}
  const tm=a.tm;if(!tm||tm.paused!=null)return;const el=tmEl(tm);
  if(el<0)fire('L'+Math.ceil(-el/1000)+'_'+tm.id,()=>beep('tick'));
  else{fire('G'+tm.id,()=>beep('go'));
    if(tm.mode==='down'){const left=tm.ms-el,s=Math.ceil(left/1000);
      if(left<=0){fire('E'+tm.id,()=>beep('end'));nextSet();return}
      if(s<=3)fire('D'+s+'_'+tm.id,()=>beep('tick'))}
    else if(el>=tm.ms)fire('H'+tm.id,()=>beep('end'))}
  const [f,b,sm,c]=timerVals();setRing('tring',f,b,sm,c)}
setInterval(tick,200);
let wl=null;async function lockScreen(){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}
function unlockScreen(){try{wl&&wl.release();wl=null}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.active){lockScreen();tick()}});

/* =========================================================
   Animation
   ========================================================= */
let io=null;
function setupFigs(){if(!('IntersectionObserver' in window))return;io&&io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>e.target.dataset.vis=e.isIntersecting?'1':'0'));
  document.querySelectorAll('svg.fig[data-ex]').forEach(s=>{s.dataset.vis='1';io.observe(s)})}
let lastTs=0;
function loop(ts){if(ts-lastTs>33){lastTs=ts;document.querySelectorAll('svg.fig[data-ex]').forEach(svg=>{if(svg.dataset.vis==='0')return;
  const id=svg.dataset.ex,e=EX[id];if(!e)return;svg.innerHTML=figSVG(e,poseAt(exFrames(id,svg.dataset.v),ts))});
  document.querySelectorAll('svg.ffig[data-fx]').forEach(svg=>{const id=svg.dataset.fx;if(GRIP[id]&&GRIP[id].fr)svg.innerHTML=fSVG(GRIP[id],poseAt(fxFrames(id),ts))})}
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* Debug: alle Schlüsselposen */
function vPoses(){let h='<h2>Posen</h2><div class="dbg">';
  for(const id of Object.keys(EX)){const vs=EX[id].variants?[null]:[null];
    exFrames(id,null).forEach((f,i)=>{h+=`<div>${id} ${i}<svg viewBox="0 0 240 212">${figSVG(EX[id],f.p)}</svg></div>`})}
  return h+'</div>'}
/* Debug: alle Griff-Ansichten (Schlüsselposen vorne + Hände) */
function vGriffe(){let h='<h2>Griffe</h2><div class="dbg">';
  for(const [id,g] of Object.entries(GRIP)){if(g.fr)fxFrames(id).forEach((f,i)=>{h+=`<div>${id} ${i}<svg viewBox="0 0 240 212">${fSVG(g,f.p)}</svg></div>`});
    if(g.g!=='frei')h+=`<div>${id} Hände<svg viewBox="0 0 240 150">${gripSVG(g)}</svg></div>`}
  return h+'</div>'}

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
route();
</script>
